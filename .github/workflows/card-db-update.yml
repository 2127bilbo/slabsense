name: card-db-update

# Weekly incremental update of the card identification database (Supabase `card-db` bucket).
# Diffs TCGDex against the manifest, embeds only new cards, appends a shard, bumps the manifest.
# Secrets required: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY.

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: models/transformers-cache
          key: clip-vit-base-patch32-v1
      - name: Update card DB
        run: node scripts/card-db/update.mjs --retry-pending | tee update-summary.txt
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: update-summary
          path: update-summary.txt
