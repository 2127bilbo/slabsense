[paths]
db = "data/raw.sqlite"

[bucket]
# From the B2 console: Buckets → your bucket → Endpoint. Region is the middle part.
endpoint = "https://s3.us-west-004.backblazeb2.com"
region = "us-west-004"
name = "slabsense-tag-dataset"
prefix = "tag-dataset"
# Keys are read from env vars B2_KEY_ID and B2_APP_KEY. Never put them here.

[fetch]
# Measured limit: TAG rate-limits at roughly 20-25 requests per 5-minute sliding
# window per client, and blocked (429) requests count toward that window. These
# defaults (1 request/15s, 2 workers) stay well under it.
rate = 0.0667
workers = 2
cooldown_start = 300
cooldown_max = 900

[download]
# Measured 2026-09-13: 16 concurrent unthrottled tripped a CloudFront block after ~750 files.
concurrency = 4
rate = 8.0
